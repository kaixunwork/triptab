<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ trip_name }}{% endblock %} · TripTab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="logo">₮</span>
        <span>TripTab<small>{{ trip_name }}</small></span>
      </a>
      {% if g.user %}
      <nav class="nav">
        <a href="{{ url_for('expenses') }}" class="{{ 'active' if request.endpoint == 'expenses' }}">Expenses</a>
        <a href="{{ url_for('balances') }}" class="{{ 'active' if request.endpoint == 'balances' }}">Balances</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="link" title="Log out">{{ g.user.display_name }} · Log out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
