{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }} expense{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>{{ 'Edit expense' if editing else 'Add an expense' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>What was it for?
      <input name="description" value="{{ data.description }}" maxlength="80"
             placeholder="e.g. Dinner at the night market" required autofocus>
    </label>
    <div class="row">
      <label>Amount ($)
        <input name="amount" value="{{ data.amount }}" inputmode="decimal" placeholder="0.00" required>
      </label>
      <label>Date
        <input name="spent_on" type="date" value="{{ data.spent_on }}" required>
      </label>
    </div>
    <label>Who paid?
      <select name="paid_by">
        {% for m in members %}
          <option value="{{ m.id }}" {{ 'selected' if m.id == data.paid_by }}>
            {{ m.display_name }}{{ ' (you)' if m.id == g.user.id }}
          </option>
        {% endfor %}
      </select>
    </label>
    <fieldset>
      <legend>Split equally between</legend>
      <div class="checks">
        {% for m in members %}
          <label class="check">
            <input type="checkbox" name="split_with" value="{{ m.id }}" {{ 'checked' if m.id in data.split_ids }}>
            {{ m.display_name }}{{ ' (you)' if m.id == g.user.id }}
          </label>
        {% endfor %}
      </div>
    </fieldset>
    <div class="form-actions">
      <a class="btn" href="{{ url_for('expenses') }}">Cancel</a>
      <button class="btn primary">{{ 'Save changes' if editing else 'Add expense' }}</button>
    </div>
  </form>
</section>
{% endblock %}
